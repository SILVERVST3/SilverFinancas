name: Build EXE Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Versão portátil (pasta com SilverFinancas.exe)
        run: gradle createDistributable --no-daemon --stacktrace

      - name: Compactar versão portátil
        shell: pwsh
        run: Compress-Archive -Path build/compose/binaries/main/app/SilverFinancas -DestinationPath SilverFinancas-portatil.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SilverFinancas-portatil
          path: SilverFinancas-portatil.zip

      - name: Instalador (.exe)
        continue-on-error: true
        run: gradle packageExe --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SilverFinancas-instalador
          path: build/compose/binaries/main/exe/*.exe
          if-no-files-found: warn
